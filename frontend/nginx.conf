server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the app and API on one origin, so the browser never needs to know
    # the API container's address or port.
    location ~ ^/(chat|sessions|messages|learning-notes)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Keep FastAPI documentation reachable through the appliance URL.
    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite produces a single-page application, so client-side routes fall
    # back to its entry point rather than returning a web-server 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
