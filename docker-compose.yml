services:

  db:
    image: postgres:17
    container_name: french-tutor-db
    restart: always
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutorpass
      POSTGRES_DB: tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: french-tutor-redis

  api:
    build:
      context: ./api
    container_name: french-tutor-api
    env_file:
      - ./api/.env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    container_name: french-tutor-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
